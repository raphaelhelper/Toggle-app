name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================
      # CHECKOUT
      # =========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================
      # JAVA 17
      # =========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================
      # GRADLE
      # =========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # =========================================
      # ANDROID SDK
      # =========================================
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"

          else
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" \
              -name sdkmanager \
              -type f \
              2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      # =========================================
      # ACCEPT LICENSES
      # =========================================
      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      # =========================================
      # INSTALL SDK
      # =========================================
      - name: Install Android SDK
        run: |
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # =========================================
      # CHECK PROJECT
      # =========================================
      - name: Check project
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          find . -maxdepth 5 -type f | sort

          echo ""
          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          gradle --version

      # =========================================
      # BUILD DEBUG APK
      # =========================================
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # =========================================
      # SHOW APK
      # =========================================
      - name: Find APK
        run: |
          echo "========================================"
          echo "GENERATED APK"
          echo "========================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # =========================================
      # UPLOAD APK
      # =========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToggleMeaning-Test-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
